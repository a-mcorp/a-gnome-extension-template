# https://lefthook.dev/
# A local bundle of formatters and linters, run with `lefthook run check`. No git hooks are installed.

check:
  commands:
    deno-fmt:
      name: "deno - format"
      glob: "*.{ts,js,json,jsonc,yaml,yml,css}"
      exclude: "dist/**"
      run: deno fmt {all_files}
    deno-lint:
      name: "deno - lint"
      glob: "*.{ts,js}"
      exclude: "dist/**"
      run: deno lint --fix {all_files}
    deno-check:
      name: "deno - check (lint plugin)"
      glob: "lint/*.ts"
      run: deno check {all_files} # https://docs.deno.com/runtime/reference/cli/check/
    tsc-typecheck:
      name: "tsc - type check (extension)"
      glob: "src/**/*.ts"
      run: deno task typecheck # `deno check` cannot resolve `gi://` imports, so the TypeScript compiler checks src/.
